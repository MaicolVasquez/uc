<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetos Perdidos | UNSA Conecta - Portal Estudiantil Universitario</title>
    <link rel="stylesheet" href="pub/css/styles.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pub/js/tailwind.config.js"></script>
</head>

<body data-page="lost-found" class="h-full text-slate-800 bg-slate-50 flex flex-col min-h-screen">

    <!-- Banner urgente + cabecera (inyectados desde pub/js/layout.js) -->
    <div id="layout-top"></div>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <section id="tab-lost-found-content" class="tab-content space-y-6">
            <!-- Header Banner -->
            <div
                class="bg-gradient-to-r from-unsa-maroon via-unsa-bright to-slate-900 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 opacity-10 text-white pointer-events-none">
                    <i class="fa-solid fa-box-open text-[200px]"></i>
                </div>
                <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <span
                            class="bg-unsa-gold text-unsa-slate text-xs font-extrabold uppercase px-3 py-1 rounded-full shadow-sm inline-block mb-2">
                            UNSA Lost & Found
                        </span>
                        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">Objetos Perdidos y Encontrados
                        </h1>
                        <p class="text-slate-200 text-sm mt-1 max-w-2xl">
                            ¿Perdiste tu carné, llaves, mochila o laptop en alguna facultad? Reporta o encuentra objetos
                            dejados en las tres áreas de la universidad.
                        </p>
                    </div>
                    <button onclick="openModal('lostFoundModal')"
                        class="bg-unsa-gold hover:bg-unsa-goldhover text-unsa-slate font-bold px-5 py-3 rounded-xl shadow-lg transition-transform hover:scale-105 flex items-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-circle-plus"></i> Reportar Objeto
                    </button>
                </div>
            </div>

            <!-- Search and Filter Controls -->
            <div
                class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-3 justify-between items-center">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="lfSearch" oninput="filterLostFound()"
                        placeholder="Buscar por título, carné, facultades..."
                        class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-unsa-maroon">
                </div>
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                    <!-- Status Filter -->
                    <select id="lfStatusFilter" onchange="filterLostFound()"
                        class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-unsa-maroon font-medium text-slate-700">
                        <option value="ALL">Todos los estados</option>
                        <option value="PERDIDO">🔴 Solo Perdidos</option>
                        <option value="ENCONTRADO">🟢 Solo Encontrados</option>
                    </select>

                    <!-- Campus Filter -->
                    <select id="lfCampusFilter" onchange="filterLostFound()"
                        class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-unsa-maroon font-medium text-slate-700">
                        <option value="ALL">Todos los Campus</option>
                        <option value="Ingenierías">Área de Ingenierías</option>
                        <option value="Sociales">Área de Sociales</option>
                        <option value="Biomédicas">Área de Biomédicas</option>
                    </select>

                    <!-- Category Filter -->
                    <select id="lfCategoryFilter" onchange="filterLostFound()"
                        class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-unsa-maroon font-medium text-slate-700">
                        <option value="ALL">Todas las Categorías</option>
                        <option value="Documentos">Carné / DNI / Cuadernos</option>
                        <option value="Electrónicos">Laptops / Celulares / Cargadores</option>
                        <option value="Llaves">Llaves / USBs</option>
                        <option value="Prendas">Casacas / Mochilas</option>
                        <option value="Otros">Otros objetos</option>
                    </select>
                </div>
            </div>

            <!-- Grid Display -->
            <div id="lostFoundGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamic cards populated by JS -->
            </div>
        </section>

    </main>

    <div id="lostFoundModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-box-open text-unsa-maroon"></i> Reportar Objeto
                </h3>
                <button onclick="closeModal('lostFoundModal')"
                    class="text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
            </div>

            <form id="lostFoundForm" onsubmit="handleSaveLostFound(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Tipo de Reporte *</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label
                            class="flex items-center justify-center gap-2 p-2.5 rounded-lg border border-slate-200 cursor-pointer text-xs font-bold hover:bg-slate-50">
                            <input type="radio" name="status" value="PERDIDO" checked class="accent-unsa-maroon">
                            <span class="text-red-600">🔴 Lo he Perdido</span>
                        </label>
                        <label
                            class="flex items-center justify-center gap-2 p-2.5 rounded-lg border border-slate-200 cursor-pointer text-xs font-bold hover:bg-slate-50">
                            <input type="radio" name="status" value="ENCONTRADO" class="accent-unsa-maroon">
                            <span class="text-green-600">🟢 Lo he Encontrado</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Título del Objeto *</label>
                    <input type="text" id="lfTitleInput" required
                        placeholder="Ej. Carné universitario a nombre de Carlos Pérez"
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-unsa-maroon focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Categoría *</label>
                        <select id="lfCategoryInput" required
                            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-unsa-maroon">
                            <option value="Documentos">Carné / DNI / Cuadernos</option>
                            <option value="Electrónicos">Laptops / Celulares / Audífonos</option>
                            <option value="Llaves">Llaves / USBs</option>
                            <option value="Prendas">Casacas / Mochilas</option>
                            <option value="Otros">Otros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Área / Campus *</label>
                        <select id="lfCampusInput" required
                            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-unsa-maroon">
                            <option value="Ingenierías">Área de Ingenierías</option>
                            <option value="Sociales">Área de Sociales</option>
                            <option value="Biomédicas">Área de Biomédicas</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Lugar Exacto de pérdida/hallazgo
                        *</label>
                    <input type="text" id="lfLocationInput" required
                        placeholder="Ej. Aula 204 de Sistemas o Jardines centrales"
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-unsa-maroon focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Fecha y Hora *</label>
                        <input type="datetime-local" id="lfDateInput" required
                            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 focus:ring-2 focus:ring-unsa-maroon">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Teléfono / WhatsApp *</label>
                        <input type="tel" id="lfPhoneInput" required placeholder="987654321"
                            class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-unsa-maroon focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">URL Foto u Objeto (Opcional)</label>
                    <input type="url" id="lfImgInput" placeholder="https://..."
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-unsa-maroon focus:outline-none">
                    <p class="text-[10px] text-slate-400 mt-0.5">Si se deja vacío, se asignará una imagen ilustrativa
                        por defecto.</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Descripción o detalles del objeto</label>
                    <textarea id="lfDescInput" rows="3"
                        placeholder="Indica color, marcas distintivas o cómo contactar directamente..."
                        class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-unsa-maroon focus:outline-none"></textarea>
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal('lostFoundModal')"
                        class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
                    <button type="submit"
                        class="px-5 py-2 text-xs font-bold text-white bg-unsa-maroon hover:bg-unsa-dark rounded-lg shadow">Publicar
                        Reporte</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast + Footer (inyectados desde pub/js/layout.js) -->
    <div id="layout-bottom"></div>

    <!-- Scripts: datos compartidos -> layout/utilidades -> lógica del módulo -->
    <script src="pub/js/data.js"></script>
    <script src="pub/js/layout.js"></script>
    <script src="pub/js/lost-found.js"></script>
</body>

</html>
