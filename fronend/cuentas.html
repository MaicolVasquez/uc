<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta | UNSA Conecta - Portal Estudiantil Universitario</title>
    <link rel="stylesheet" href="pub/css/styles.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pub/js/tailwind.config.js"></script>
</head>

<body data-page="cuenta" class="h-full text-slate-800 bg-slate-50 flex flex-col min-h-screen">

    <div id="layout-top"></div>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <section id="tab-cuenta-content" class="max-w-md mx-auto">

            <!-- Cargando -->
            <div id="authLoading" class="text-center text-slate-500 py-16 text-sm">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Verificando sesión...
            </div>

            <!-- Formularios (sin sesión) -->
            <div id="authForms" class="hidden bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                <div class="bg-gradient-to-r from-unsa-maroon to-unsa-bright text-white p-6 text-center">
                    <div
                        class="w-14 h-14 mx-auto rounded-2xl bg-unsa-gold text-unsa-maroon flex items-center justify-center text-2xl mb-3 shadow-lg">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <h1 class="text-xl font-extrabold">Tu cuenta UNSA Conecta</h1>
                    <p class="text-xs text-yellow-100 mt-1">Inicia sesión o crea tu cuenta de estudiante</p>
                </div>

                <div class="flex border-b border-slate-200">
                    <button id="tabLogin" type="button" onclick="showAuthTab('login')"
                        class="flex-1 py-3 text-sm font-semibold text-slate-500 hover:text-unsa-maroon transition-colors">Iniciar
                        sesión</button>
                    <button id="tabRegister" type="button" onclick="showAuthTab('register')"
                        class="flex-1 py-3 text-sm font-semibold text-slate-500 hover:text-unsa-maroon transition-colors">Crear
                        cuenta</button>
                </div>

                <div id="authError"
                    class="hidden mx-6 mt-5 bg-red-50 border border-red-200 text-red-700 text-xs font-medium rounded-lg px-3 py-2">
                </div>

                <!-- Login -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1" for="loginEmail">Correo
                            electrónico</label>
                        <input type="email" id="loginEmail" required autocomplete="email"
                            placeholder="tucorreo@unsa.edu.pe"
                            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-unsa-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1"
                            for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" required autocomplete="current-password"
                            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-unsa-gold">
                    </div>
                    <button type="submit"
                        class="w-full bg-unsa-maroon hover:bg-unsa-dark text-white font-bold py-2.5 rounded-xl text-sm transition-colors">
                        Ingresar
                    </button>
                </form>

                <!-- Registro -->
                <form id="registerForm" onsubmit="handleRegister(event)" class="hidden p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1" for="regName">Nombre
                            (opcional)</label>
                        <input type="text" id="regName" autocomplete="name" placeholder="Diego Quispe"
                            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-unsa-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1" for="regEmail">Correo
                            electrónico</label>
                        <input type="email" id="regEmail" required autocomplete="email"
                            placeholder="tucorreo@unsa.edu.pe"
                            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-unsa-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1" for="regPassword">Contraseña (mín. 6
                            caracteres)</label>
                        <input type="password" id="regPassword" required minlength="6" autocomplete="new-password"
                            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-unsa-gold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1" for="regPassword2">Repetir
                            contraseña</label>
                        <input type="password" id="regPassword2" required minlength="6" autocomplete="new-password"
                            class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-unsa-gold">
                    </div>
                    <button type="submit"
                        class="w-full bg-unsa-gold hover:bg-unsa-goldhover text-unsa-maroon font-bold py-2.5 rounded-xl text-sm transition-colors">
                        Crear cuenta
                    </button>
                </form>
            </div>

            <!-- Perfil (con sesión) -->
            <div id="profileCard" class="hidden bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                <div class="bg-gradient-to-r from-unsa-maroon to-unsa-bright text-white p-6 text-center">
                    <div class="w-16 h-16 mx-auto rounded-full bg-unsa-gold text-unsa-maroon flex items-center justify-center text-2xl font-black mb-3 shadow-lg"
                        id="profileInitial">U</div>
                    <h1 class="text-xl font-extrabold" id="profileName">—</h1>
                    <p class="text-xs text-yellow-100 mt-1" id="profileEmail">—</p>
                </div>
                <div class="p-6 space-y-3 text-sm">
                    <div class="flex justify-between border-b border-slate-100 pb-2">
                        <span class="text-slate-500">ID de usuario</span>
                        <span class="font-mono text-xs text-slate-700" id="profileId">—</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-100 pb-2">
                        <span class="text-slate-500">Cuenta creada</span>
                        <span class="text-slate-700" id="profileDate">—</span>
                    </div>
                    <button type="button" onclick="handleLogout()"
                        class="w-full mt-2 bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div id="layout-bottom"></div>

    <script src="pub/js/layout.js"></script>
    <script src="pub/js/auth.js"></script>
</body>

</html>
