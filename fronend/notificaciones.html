<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones | UNSA Conecta - Portal Estudiantil Universitario</title>
    <link rel="stylesheet" href="pub/css/styles.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="pub/js/tailwind.config.js"></script>
</head>

<body data-page="announcements" class="h-full text-slate-800 bg-slate-50 flex flex-col min-h-screen">

    <!-- Banner urgente + cabecera (inyectados desde pub/js/layout.js) -->
    <div id="layout-top"></div>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <section id="tab-announcements-content" class="tab-content space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Tablón de Notificaciones y Avisos UNSA</h1>
                    <p class="text-sm text-slate-500">Mantente informado sobre feriados académicos, comunicados de
                        huelgas, trámites de matrícula, estado de bibliotecas.</p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-medium text-slate-500">Filtrar por Urgencia:</span>
                    <select id="urgencyFilter" onchange="filterAnnouncements()"
                        class="bg-white border border-slate-200 text-slate-700 text-xs rounded-lg p-2 font-medium focus:ring-2 focus:ring-unsa-maroon">
                        <option value="ALL">Todas las alertas</option>
                        <option value="URGENTE">🚨 Alta Prioridad (Urgentes)</option>
                        <option value="INFO">ℹ️ Información General</option>
                        <option value="EVENTO">📅 Eventos y Asambleas</option>
                    </select>

                    <!-- Solo visible para administradores (lo activa announcements.js) -->
                    <button id="annCreateBtn" onclick="openModal('annCreateModal')"
                        class="hidden ml-2 bg-unsa-maroon hover:bg-unsa-dark text-white font-bold px-3 py-2 rounded-lg text-xs whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i> Nuevo anuncio
                    </button>
                </div>
            </div>

            <!-- Categories Tabs Filter -->
            <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none border-b border-slate-200">
                <button onclick="filterAnnouncementCategory('ALL', this)"
                    class="ann-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-unsa-maroon text-white shadow-sm whitespace-nowrap">
                    Todos los avisos
                </button>
                <button onclick="filterAnnouncementCategory('Huelgas', this)"
                    class="ann-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 whitespace-nowrap">
                    📢 Huelgas & Paros
                </button>
                <button onclick="filterAnnouncementCategory('Feriados', this)"
                    class="ann-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 whitespace-nowrap">
                    🌴 Feriados Academicos
                </button>
                <button onclick="filterAnnouncementCategory('Biblioteca', this)"
                    class="ann-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 whitespace-nowrap">
                    📚 Biblioteca Central
                </button>
                <button onclick="filterAnnouncementCategory('Tramites', this)"
                    class="ann-cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 whitespace-nowrap">
                    📝 Trámites & Matrícula
                </button>
            </div>
            
            <!-- Grid List of Announcements -->
            <div id="announcementsGrid" class="grid gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
            
            </section>

    </main>

    <!-- Modal: crear anuncio (admin y delegado) -->
    <div id="annCreateModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4"
        onclick="if(event.target===this) closeModal('annCreateModal')">
        <form id="annCreateForm" onsubmit="handleSaveAnnouncement(event)"
            class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">

            <div class="sticky top-0 bg-white px-6 pt-5 pb-3 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-extrabold text-lg text-slate-900">Nuevo anuncio</h3>
                <button type="button" onclick="closeModal('annCreateModal')"
                    class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button>
            </div>

            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Título *</label>
                    <input id="annTitle" required maxlength="150" placeholder="Ej. Paro de docentes"
                        class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Categoría</label>
                        <select id="annCategory" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                            <option value="Huelgas">📢 Huelgas & Paros</option>
                            <option value="Feriados">🌴 Feriados Académicos</option>
                            <option value="Biblioteca">📚 Biblioteca Central</option>
                            <option value="Tramites">📝 Trámites & Matrícula</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Urgencia</label>
                        <select id="annUrgency" class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                            <option value="INFO">ℹ️ Información</option>
                            <option value="URGENTE">🚨 Urgente</option>
                            <option value="EVENTO">📅 Evento</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">¿Cuándo será? (fecha y hora)</label>
                        <input id="annEventAt" type="datetime-local"
                            class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Campus afectado</label>
                        <input id="annCampus" maxlength="80" placeholder="Ej. Todos los campus"
                            class="w-full border border-slate-200 rounded-lg p-2 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Imagen (opcional)</label>
                    <input id="annImage" type="file" accept="image/jpeg,image/png,image/webp"
                        onchange="previewAnnImage(this)"
                        class="w-full text-xs file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-slate-100 file:text-slate-700 file:font-bold">
                    <img id="annImagePreview" class="hidden mt-3 rounded-xl max-h-48 object-cover border border-slate-200" alt="">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Descripción *</label>
                    <textarea id="annContent" required maxlength="2000" rows="5" placeholder="Detalles del aviso"
                        class="w-full border border-slate-200 rounded-lg p-2 text-sm"></textarea>
                </div>
            </div>

            <div class="sticky bottom-0 bg-white px-6 py-4 border-t border-slate-100 flex justify-end gap-2">
                <button type="button" onclick="closeModal('annCreateModal')"
                    class="px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
                <button type="submit"
                    class="bg-unsa-maroon hover:bg-unsa-dark text-white font-bold px-4 py-2 rounded-lg text-sm">Publicar</button>
            </div>
        </form>
    </div>
    
    <!-- Toast + Footer (inyectados desde pub/js/layout.js) -->
    <div id="layout-bottom"></div>

    <!-- Scripts: datos compartidos -> layout/utilidades -> lógica del módulo -->
    <script src="pub/js/data.js"></script>
    <script src="pub/js/layout.js"></script>
    <script src="pub/js/announcements.js"></script>
</body>

</html>
